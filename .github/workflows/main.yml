name: EAS Build
on:
  workflow_dispatch: # इससे आप GitHub वेबसाइट से मैन्युअली बिल्ड ट्रिगर कर सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Run EAS Build
        run: eas build --platform android --profile preview --non-interactive
        
